<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Knowledge</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🏀 Ball Knowledge</h1>
    <p class="tagline">Draft five decades of NBA legends. Win the game.</p>
  </header>

  <main id="app-root">
    <!-- Screens are toggled via JS by adding/removing .hidden -->

    <section id="screen-home" class="screen">
      <div class="card">
        <h2>New Draft Battle</h2>
        <div class="field-row">
          <label for="input-name-a">Your name</label>
          <input id="input-name-a" type="text" maxlength="20" placeholder="Player 1" />
        </div>
        <div class="mode-toggle">
          <label class="radio-option">
            <input type="radio" name="mode" value="bot" checked />
            vs. Bot
          </label>
          <label class="radio-option">
            <input type="radio" name="mode" value="local" />
            Local 2-Player (pass & play)
          </label>
        </div>
        <div class="field-row" id="row-name-b" hidden>
          <label for="input-name-b">Player 2 name</label>
          <input id="input-name-b" type="text" maxlength="20" placeholder="Player 2" />
        </div>
        <button id="btn-start-draft" class="btn btn-primary">Start Draft</button>
      </div>

      <div class="card">
        <h2>Progression</h2>
        <div id="home-tier-summary"></div>
        <button id="btn-view-leaderboard" class="btn btn-secondary">View Leaderboard</button>
      </div>
    </section>

    <section id="screen-draft" class="screen hidden">
      <div class="draft-header">
        <div id="draft-round-label" class="round-label"></div>
        <div id="draft-squad-label" class="squad-label"></div>
      </div>

      <div id="draft-turn-banner" class="turn-banner"></div>

      <div class="draft-body">
        <div class="roster-panel" id="roster-panel-a"></div>

        <div class="draft-pool-panel">
          <input id="pool-search" type="text" placeholder="Search this squad's roster…" autocomplete="off" />
          <div id="pool-list" class="pool-list"></div>
          <div id="slot-picker" class="slot-picker hidden"></div>
          <button id="btn-skip-round" class="btn btn-secondary">Skip Round</button>
        </div>

        <div class="roster-panel" id="roster-panel-b"></div>
      </div>
    </section>

    <section id="screen-boxscore" class="screen hidden">
      <div id="final-banner" class="final-banner"></div>
      <div id="mvp-callout" class="mvp-callout"></div>

      <div class="quarter-tabs" id="quarter-tabs"></div>
      <div id="quarter-panel"></div>

      <h3>Full Game Box Score</h3>
      <div id="full-box-score"></div>

      <button id="btn-to-leaderboard" class="btn btn-secondary">View Progression</button>
      <button id="btn-play-again" class="btn btn-primary">Play Again</button>
    </section>

    <section id="screen-leaderboard" class="screen hidden">
      <h2>Progression &amp; Leaderboard</h2>
      <div id="leaderboard-tier"></div>
      <table class="history-table">
        <thead>
          <tr><th>Date</th><th>Result</th><th>Score</th><th>MVP</th><th>Tier</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <button id="btn-back-home" class="btn btn-secondary">Back to Home</button>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
