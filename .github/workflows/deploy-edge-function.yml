# Deploys the simulate-match Edge Function whenever it changes on main.
#
# The function is the other half of the app: GitHub Pages serves the client
# from this repo automatically, but the server that actually simulates online
# matches had to be pushed by hand. That gap is where bugs went to hide - the
# forfeit penalty, per-era records and the whole ELO system all sat written but
# undeployed, so the live site ran client code against a server that had never
# heard of it. "Make client code tolerate a server that hasn't caught up yet"
# (CLAUDE.md) is still good advice, but it should be covering a few minutes of
# deploy lag, not weeks.
#
# Runs only when supabase/functions/** changes, so an ordinary front-end push
# doesn't redeploy a function that didn't move.
name: Deploy Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-function.yml"
  # Lets you deploy on demand from the Actions tab without pushing anything -
  # useful the first time, when the function is already behind main.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Everything below is checked against the files in this same checkout, so
      # a commit that changed the client engine without copying it across fails
      # HERE rather than by quietly diverging in production. This is the one
      # moment both halves are guaranteed to be looking at the same tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:parity -- --no-network

      # Basketball parity alone was the whole gate, which left three ways for a
      # broken server to ship clean:
      #
      #   nfl-parity      verify:parity's numeric checks are wired to the NBA
      #                   directories, so a divergence between the client and
      #                   the vendored FOOTBALL engine deployed unnoticed - and
      #                   football is half the games this function simulates.
      #   server-dataset  the function builds its rating context from a
      #                   PostgREST query that silently caps at 1000 rows
      #                   unless it pages. It shipped that way once: the
      #                   simulation still ran, the box score still added up,
      #                   and it was a different game.
      #   edge-outcome    executes buildMatchOutcome itself - the ranked/
      #                   friendly boundary and the profile bookkeeping. Until
      #                   this existed nothing in the repo had ever RUN
      #                   index.ts; it was checked by regex and a parse.
      - run: npm run verify:nfl-parity
      - run: npm run verify:server-dataset

      # The committed dataset against the LIVE `players` table.
      #
      # This lives here and NOT in the PR gate on purpose. It compares the repo
      # against mutable production state, so it can go red without anyone
      # touching the code - which is exactly what happened when the PR job was
      # widened to the whole suite: an unrelated PR was blocked by a dataset
      # drift that had been sitting in the table for weeks. A check a
      # contributor cannot fix from their branch does not belong on their PR.
      #
      # A deploy is the right place for it: datasetStats normalizes every
      # matchup, so shipping an engine against a drifted table changes online
      # box scores even with identical engine code.
      - run: npm run verify:live
      - run: npm run verify:edge-outcome

      - name: Deploy simulate-match
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy simulate-match --project-ref ${{ vars.SUPABASE_PROJECT_REF || 'aauvgiygwrwdbtruhxta' }}
