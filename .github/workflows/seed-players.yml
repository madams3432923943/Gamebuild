# Publishes the per-season NBA dataset to the database.
#
# It exists because the alternative was asking a human to generate a 1MB SQL
# file and paste it into a query console. Every step of that is a step where a
# batch goes missing, and a half-loaded players table is worse than an unloaded
# one: the draft finds some of a player's seasons and not others, with no error
# anywhere to say so.
#
# It runs AUTOMATICALLY on a push that changes the dataset, for the reasons set
# out in seed-nfl.yml: the table is a derived artifact of data/nba-players.json,
# and "someone runs the workflow afterwards" is a convention, not a mechanism.
# The empty-table window that once made an automatic publish unsafe is gone -
# rows land in a staging table nothing reads and one statement swaps them in.
# See db/migrations/20260820_01_atomic_dataset_publish.sql.
name: Seed Players

on:
  push:
    branches: [main]
    paths:
      - "data/nba-players.json"
      - "tools/export-players-sql.mjs"
      - "tools/apply-seed.mjs"
  workflow_dispatch:

concurrency:
  group: seed-players
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generated here rather than committed: it is derivable from
      # data/nba-players.json in one command, and generating it in the same run
      # that applies it means the two can never disagree.
      - name: Generate the seed
        run: node tools/export-players-sql.mjs

      - name: Apply it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/apply-seed.mjs --project-ref ${{ vars.SUPABASE_PROJECT_REF || 'aauvgiygwrwdbtruhxta' }}

      # Asks the live table what it holds and compares it against data/, over
      # the same public read path the client uses. A 200 from every request is
      # not evidence that the pool the game reads was replaced.
      - name: Install dependencies
        run: npm ci

      - name: Confirm the live pool is this repo's pool
        run: npm run verify:dataset-published
