name: Verify Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The whole suite, not a hand-picked subset.
  #
  # This job used to name eleven steps out of the ~34 in `npm run verify`. Every
  # check outside that list - pick eligibility, era rotation, the online strategy
  # contract, NFL realism and gameplans, provenance, kits, banners, icons, bot
  # difficulty, the Edge Function's outcome builder - ran only on someone's
  # laptop, if they remembered. A suite that large is worth having only if it is
  # the thing that gates the merge.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:stamp compares this commit against its parent.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BEFORE the suite, because `npm run verify` re-stamps index.html as a
      # side effect and would mask exactly what this looks for.
      #
      # It asks whether the stamp MOVED when js/ or css/ moved - not whether it
      # equals HEAD. stamp-build.mjs runs before the commit containing its own
      # output exists, so the stamp is always one commit behind by construction
      # and two behind on a merge. A check demanding equality goes red on every
      # merge and trains everyone to ignore it.
      - name: Build stamp moved with the code
        run: npm run verify:stamp

      # Several verify steps drive a real browser, so Chromium is installed
      # before the suite rather than partway through it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        env:
          SIM_RUNS: 5000
        run: npm run verify

      # `verify` proves the modules parse and the contracts hold. It does not
      # prove the app runs - two blank-screen bugs shipped past a green verify
      # because nothing loaded a page. These do, at desktop and at 360px.
      - name: Verify the app actually plays
        run: npm run verify:selftest

      - name: Verify the app plays on a phone
        run: npm run verify:selftest:mobile

      - name: Bundle browser app
        run: npm run bundle

      - name: TypeScript and dependency parse for ranked Edge Function
        run: >-
          npx esbuild supabase/functions/simulate-match/index.ts
          --bundle --platform=neutral --format=esm
          --external:jsr:* --outfile=/tmp/simulate-match.js

