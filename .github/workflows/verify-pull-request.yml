name: Verify Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify sport contracts
        run: npm run verify:contract

      - name: Verify playable configuration
        run: npm run verify:playable

      # The ranked draft board is the one thing here that has to be checked in
      # a real browser: the search blank-out was a DOM-render throw that every
      # module-level test walked straight past.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify ranked search renders
        run: npm run verify:ranked-search

      - name: Verify client/server parity
        run: npm run verify:parity -- --no-network

      - name: Verify simulation statistically
        env:
          SIM_RUNS: 5000
        run: npm run verify:simulation

      - name: Bundle browser app
        run: npm run bundle

      - name: TypeScript and dependency parse for ranked Edge Function
        run: >-
          npx esbuild supabase/functions/simulate-match/index.ts
          --bundle --platform=neutral --format=esm
          --external:jsr:* --outfile=/tmp/simulate-match.js
