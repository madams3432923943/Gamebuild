name: Verify Pull Request

# THREE TRIGGERS, BECAUSE THE pull_request ONE IS SLOW TO ARRIVE.
#
# Not broken - slow, and erratically so. Measured across four recent pushes,
# the pull_request run was created 0.7, 2.6, 7.2 and 12.4 minutes after the
# event that should have produced it. It always arrives; you just cannot tell
# early on whether it is coming.
#
# That matters because of how it is misread. A PR with no checks yet does not
# look like a PR waiting on a slow queue - it looks like a PR whose checks are
# green by absence, and it reads as safe to merge to anyone who takes "no red"
# for "go". Twelve minutes is long enough for someone to reach that conclusion
# and act on it.
#
# A NOTE FOR WHOEVER CHECKS THIS NEXT, because it cost a full misdiagnosis:
# the commit STATUS api (/statuses, "combined status") is not where Actions
# reports. Actions writes CHECK RUNS. A repository whose CI is entirely Actions
# has an empty status list forever, so "total_count: 0" from that endpoint says
# nothing at all about whether CI ran. Ask for check runs, and give the suite a
# few minutes to appear before concluding anything.
#
# So: the branch push is the PROMPT trigger - it lands in about two seconds -
# and pull_request stays as the one that runs against the merge result. main is
# excluded because verify-main.yml already owns it; without that exclusion
# every merge would run the suite twice.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# KEYED ON THE COMMIT, not on the PR number or the ref.
#
# With two triggers a single commit can arrive twice - once as a push to the
# branch and once as the PR's synchronize - and grouping by ref or PR number
# puts those in different groups, so both would run the whole suite against
# identical code. The head sha is the same value on both paths, so they land in
# one group and the newer cancels the older.
#
# github.sha is the MERGE commit on a pull_request event and the branch head on
# a push, which is why the PR path reads head.sha explicitly instead.
concurrency:
  group: verify-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# TWO JOBS, IN PARALLEL, BECAUSE ONE SERIAL JOB STOPPED FITTING.
#
# This was a single job running all 34 verify steps plus both browser
# selftests end to end. It took 25-30 minutes against a 30-minute timeout -
# close enough to its own ceiling that a slow runner would have failed a green
# branch, and slow enough that every change cost half an hour before anyone
# could merge it.
#
# Only six of the 34 steps drive Chromium. Those six plus the selftests are the
# expensive half AND the only half that needs the ~170MB browser download; the
# other 28 need nothing but `npm ci`. Splitting them means the node half
# reports in a few minutes instead of waiting behind a browser it never uses,
# and neither half carries the other's runtime.
#
# Both must pass. Nothing was dropped from the suite to make this fit - the
# point of widening the gate was that the whole suite gates the merge.

jobs:
  # 28 of the 34 steps. No Chromium download at all.
  node:
    name: verify (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:stamp compares this commit against its parent.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BEFORE the suite, because `npm run verify` re-stamps index.html as a
      # side effect and would mask exactly what this looks for.
      #
      # It asks whether the stamp MOVED when js/ or css/ moved - not whether it
      # equals HEAD. stamp-build.mjs runs before the commit containing its own
      # output exists, so the stamp is always one commit behind by construction
      # and two behind on a merge. A check demanding equality goes red on every
      # merge and trains everyone to ignore it.
      - name: Build stamp moved with the code
        run: npm run verify:stamp

      - name: Verify (node)
        env:
          SIM_RUNS: 5000
        run: npm run verify:node

      - name: Bundle browser app
        run: npm run bundle

      - name: TypeScript and dependency parse for ranked Edge Function
        run: >-
          npx esbuild supabase/functions/simulate-match/index.ts
          --bundle --platform=neutral --format=esm
          --external:jsr:* --outfile=/tmp/simulate-match.js

  # The six Chromium steps, plus the selftests that prove the app actually
  # runs. `verify` proves the modules parse and the contracts hold; it does not
  # prove the app starts - two blank-screen bugs shipped past a green verify
  # because nothing loaded a page.
  browser:
    name: verify (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify (browser)
        run: npm run verify:browser

      - name: Verify the app actually plays
        run: npm run verify:selftest

      - name: Verify the app plays on a phone
        run: npm run verify:selftest:mobile
