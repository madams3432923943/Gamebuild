name: Verify Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify sport contracts
        run: npm run verify:contract

      - name: Verify playable configuration
        run: npm run verify:playable

      # The rendered screens have to be checked in a real browser. Both bugs
      # these cover were DOM-render throws that every module-level test walked
      # straight past - one blanked the draft board, one misaligned every
      # NBA box score.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify ranked search renders
        run: npm run verify:ranked-search

      - name: Verify box scores render per sport
        run: npm run verify:box-score

      - name: Verify NFL box-score attribution
        run: npm run verify:nfl-box-score

      - name: Verify each sport's game-screen stage
        run: npm run verify:game-stage

      - name: Verify NFL drive playback and pacing
        run: npm run verify:nfl-playback

      - name: Verify client/server parity
        run: npm run verify:parity -- --no-network

      - name: Verify simulation statistically
        env:
          SIM_RUNS: 5000
        run: npm run verify:simulation

      - name: Bundle browser app
        run: npm run bundle

      - name: TypeScript and dependency parse for ranked Edge Function
        run: >-
          npx esbuild supabase/functions/simulate-match/index.ts
          --bundle --platform=neutral --format=esm
          --external:jsr:* --outfile=/tmp/simulate-match.js
