name: Debug ranked search
on:
  push:
    branches: [main]
    paths:
      - scripts/verify-ranked-search.mjs
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-ranked-search.mjs
