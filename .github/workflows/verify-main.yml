name: Verify main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-main
  cancel-in-progress: false

jobs:
  # Nothing ran on push to main before this. The PR check was the only gate,
  # and it is skippable by pushing straight to the branch - which is how a
  # commit reaches GitHub Pages, since Pages serves the repo root from main.
  #
  # WHAT THIS DOES AND DOES NOT DO. Pages deploys from the branch, so this
  # cannot block a bad deploy: by the time it fails, the site is already
  # serving that commit. What it does is tell you within minutes instead of
  # whenever someone next opens a pull request, and it puts a red mark on the
  # commit that did it.
  #
  # To make main genuinely gated, switch the Pages source from "deploy from a
  # branch" to "GitHub Actions" and have this workflow publish the artifact
  # after the suite passes. That is a repository setting as much as a workflow
  # change, so it is written down here rather than done silently - flipping it
  # without the setting means the site stops updating at all.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:stamp compares this commit against its parent.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The stamp is what stops browsers serving cached ES modules after a
      # deploy. Checked BEFORE `npm run verify`, because verify re-stamps
      # index.html as a side effect and would mask exactly what this looks for.
      #
      # It asks whether the stamp MOVED when js/ or css/ moved - not whether it
      # equals HEAD. stamp-build.mjs runs before the commit containing its own
      # output exists, so the stamp is always one commit behind by construction
      # and two behind on a merge. A check demanding equality goes red on every
      # merge and trains everyone to ignore it.
      - name: Build stamp moved with the code
        run: npm run verify:stamp

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        env:
          SIM_RUNS: 5000
        run: npm run verify

      - name: Verify the app actually plays
        run: npm run verify:selftest

      - name: Verify the app plays on a phone
        run: npm run verify:selftest:mobile

