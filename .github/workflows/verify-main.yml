name: Verify main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# NO CONCURRENCY GROUP, deliberately.
#
# This had `group: verify-main` with cancel-in-progress: false, on the theory
# that runs would queue. They do not: GitHub keeps at most ONE pending run per
# group and cancels the older one, so a burst of merges leaves every commit but
# the last unverified. Four runs, three cancelled, zero completed - main was
# never actually verified once.
#
# Every commit on main gets its own run. That is the entire point of a workflow
# whose job is to tell you which commit broke something.

jobs:
  # Nothing ran on push to main before this. The PR check was the only gate,
  # and it is skippable by pushing straight to the branch - which is how a
  # commit reaches GitHub Pages, since Pages serves the repo root from main.
  #
  # WHAT THIS DOES AND DOES NOT DO. Pages deploys from the branch, so this
  # cannot block a bad deploy: by the time it fails, the site is already
  # serving that commit. What it does is tell you within minutes instead of
  # whenever someone next opens a pull request, and it puts a red mark on the
  # commit that did it.
  #
  # To make main genuinely gated, switch the Pages source from "deploy from a
  # branch" to "GitHub Actions" and have this workflow publish the artifact
  # after the suite passes. That is a repository setting as much as a workflow
  # change, so it is written down here rather than done silently - flipping it
  # without the setting means the site stops updating at all.
  # Split node/browser for the same reason as verify-pull-request.yml: only six
  # of the 34 steps drive Chromium, and one serial job ran 25-30 minutes
  # against a 30-minute ceiling.
  node:
    name: verify (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:stamp compares this commit against its parent.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The stamp is what stops browsers serving cached ES modules after a
      # deploy. Checked BEFORE `npm run verify`, because verify re-stamps
      # index.html as a side effect and would mask exactly what this looks for.
      #
      # It asks whether the stamp MOVED when js/ or css/ moved - not whether it
      # equals HEAD. stamp-build.mjs runs before the commit containing its own
      # output exists, so the stamp is always one commit behind by construction
      # and two behind on a merge. A check demanding equality goes red on every
      # merge and trains everyone to ignore it.
      - name: Build stamp moved with the code
        run: npm run verify:stamp

      - name: Verify (node)
        env:
          SIM_RUNS: 5000
        run: npm run verify:node

  # DOES THE SERVER PLAY ON THE POOL IN THIS COMMIT?
  #
  # Its own job rather than a step in `node`, because it is the one check here
  # that asserts something about the WORLD rather than about the code: it reads
  # the live tables. That makes it the check most likely to fail for reasons
  # unrelated to the commit, and separating it means such a failure names itself
  # instead of hiding behind "verify (node) failed".
  #
  # SKIPPED WHEN THIS PUSH CHANGED data/. The Seed workflows fire on the same
  # push and are what makes the two agree again; running this alongside them is
  # a race the seed usually loses, since it has ~14,000 rows to send. The seed
  # workflows run this same check as their own last step, so the case skipped
  # here is covered there - with the publish already done.
  published:
    name: verify (published dataset)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Did this push change a dataset?
        id: data
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD -- data tools/export-players-sql.mjs tools/export-nfl-sql.mjs tools/apply-seed.mjs || true)
          if [ -n "$changed" ]; then
            echo "seeding=true" >> "$GITHUB_OUTPUT"
            echo "This push touched:"; echo "$changed"
            echo "The Seed workflows own the comparison for this commit."
          else
            echo "seeding=false" >> "$GITHUB_OUTPUT"
          fi

      - name: The live pool is this commit's pool
        if: steps.data.outputs.seeding != 'true'
        run: npm run verify:dataset-published

  browser:
    name: verify (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify (browser)
        run: npm run verify:browser

      - name: Verify the app actually plays
        run: npm run verify:selftest

      - name: Verify the app plays on a phone
        run: npm run verify:selftest:mobile

