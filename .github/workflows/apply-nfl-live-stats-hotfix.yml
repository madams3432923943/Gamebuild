name: Apply NFL Live Stats Hotfix

on:
  push:
    branches:
      - agent/nfl-live-stats-hotfix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: populate NFL live and final stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nfl-live-stats-hotfix
          fetch-depth: 0

      - name: Apply focused hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/main.js')
          text = path.read_text()

          old = '''        for (const stat of ["pts", "reb", "ast", "stl", "blk", "tov"]) liveTotals[key][slot][stat] += src[stat];'''
          new = '''        // Accumulate whichever statistics the active sport declares. This was
        // hardcoded to basketball's six keys, leaving every NFL live column at
        // zero even though the engine had produced a complete football ledger.
        for (const stat of ["pts", ...sport().lineKeys]) {
          liveTotals[key][slot][stat] = (Number(liveTotals[key][slot][stat]) || 0) + (Number(src[stat]) || 0);
        }'''
          if old not in text:
              raise SystemExit('live stat accumulator target not found')
          text = text.replace(old, new, 1)

          old = '''    const mvp = result.mvp;
    const mvpTeamName = mvp.side === "A" ? labelA : labelB;
    mvpCallout.textContent = `MVP: ${mvp.player.name} (${mvpTeamName}) — ${Math.round(
      mvp.line.pts
    )} PTS / ${Math.round(mvp.line.reb)} REB / ${Math.round(mvp.line.ast)} AST`;
    mvpCallout.classList.remove("hidden");'''
          new = '''    const mvp = result.mvp;
    if (mvp?.player && mvp?.line) {
      const mvpTeamName = mvp.side === "A" ? labelA : labelB;
      let mvpSummary;
      if (sport().id === "nba") {
        mvpSummary = `${Math.round(mvp.line.pts || 0)} PTS / ${Math.round(mvp.line.reb || 0)} REB / ${Math.round(mvp.line.ast || 0)} AST`;
      } else {
        const preferred = ["pass_yds", "pass_tds", "rush_yds", "rush_tds", "rec", "rec_yds", "rec_tds", "ints", "fumbles", "fgs"];
        const parts = preferred
          .filter((key) => Number(mvp.line[key]) > 0)
          .slice(0, 3)
          .map((key) => `${Math.round(Number(mvp.line[key]) || 0)} ${sport().statLabels?.[key] || key.toUpperCase()}`);
        mvpSummary = parts.join(" / ") || `${Math.round(Number(mvp.line.pts) || 0)} PTS`;
      }
      mvpCallout.textContent = `MVP: ${mvp.player.name} (${mvpTeamName}) — ${mvpSummary}`;
      mvpCallout.classList.remove("hidden");
    } else {
      mvpCallout.classList.add("hidden");
    }'''
          if old not in text:
              raise SystemExit('MVP formatter target not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('scripts/verify-nfl-live-stats.mjs')
          test.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nimport { NFL } from "../js/sports/nfl/index.js";\n\nconst main = fs.readFileSync(new URL("../js/main.js", import.meta.url), "utf8");\nassert.match(main, /for \(const stat of \["pts", \.\.\.sport\(\)\.lineKeys\]\)/, "live playback must accumulate sport-declared line keys");\nassert.doesNotMatch(main, /for \(const stat of \["pts", "reb", "ast", "stl", "blk", "tov"\]\)/, "basketball-only accumulator must be removed");\nassert.match(main, /sport\(\)\.id === "nba"/, "MVP formatting must branch by sport");\n\nconst players = NFL.players();\nconst by = (pos) => players.find((p) => Array.isArray(p.pos) && p.pos.includes(pos));\nconst unit = (pos) => players.find((p) => Array.isArray(p.pos) && p.pos.includes(pos));\nconst roster = { QB: by("QB"), RB: by("RB"), WR: by("WR"), TE: by("TE"), OL: unit("OL"), DEF: unit("DEF") || unit("LB") };\nassert.ok(Object.values(roster).every(Boolean), "fixture roster must be complete");\nconst result = NFL.simulate(roster, roster, NFL.computeDatasetStats(players), { seed: 3432923943 });\nconst keys = NFL.lineKeys;\nconst total = Object.values(result.boxA).reduce((sum, line) => sum + keys.reduce((s, key) => s + (Number(line?.[key]) || 0), 0), 0);\nassert.ok(total > 0, "NFL engine must provide non-zero football stats for the UI to accumulate");\nconsole.log("[PASS] NFL live accumulator uses sport line keys");\nconsole.log("[PASS] NFL final MVP formatting is sport-native");\nconsole.log("[PASS] NFL engine fixture produces non-zero box stats");\n''')

          pkg = Path('package.json')
          import json
          data = json.loads(pkg.read_text())
          data.setdefault('scripts', {})['verify:nfl-live-stats'] = 'node scripts/verify-nfl-live-stats.mjs'
          verify = data['scripts'].get('verify', '')
          if 'verify:nfl-live-stats' not in verify:
              data['scripts']['verify'] = verify + ' && npm run verify:nfl-live-stats'
          pkg.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Run verification
        run: npm run verify

      - name: Commit hotfix
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add js/main.js scripts/verify-nfl-live-stats.mjs package.json
          git commit -m "fix: populate NFL live and final stats"
          git push origin agent/nfl-live-stats-hotfix
