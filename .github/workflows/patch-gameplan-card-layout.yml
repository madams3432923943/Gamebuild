name: Patch gameplan card layout

on:
  push:
    branches:
      - fix/gameplan-card-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gameplan-card-layout
          fetch-depth: 0
      - name: Fix NFL gameplan card layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('css/style.css')
          css = path.read_text()
          old = ".tactic-phase .tactic-card {\n  min-height: 0;\n  flex-direction: row;\n  align-items: center;\n  gap: 0.6rem;\n}\n\n.tactic-phase .tactic-head { flex: 0 0 9.5rem; }\n"
          new = ".tactic-phase .tactic-card {\n  min-height: 0;\n  flex-direction: column;\n  align-items: stretch;\n  gap: 0.45rem;\n  padding: 0.75rem 0.8rem;\n}\n\n.tactic-phase .tactic-head {\n  flex: none;\n  width: 100%;\n  font-size: 0.82rem;\n  line-height: 1.2;\n}\n\n.tactic-phase .tactic-blurb {\n  width: 100%;\n  font-size: 0.72rem;\n  line-height: 1.35;\n}\n"
          if old not in css:
              raise SystemExit('Expected tactic-phase card override not found')
          path.write_text(css.replace(old, new, 1))
          PY
          git config user.name "Draft Nova Automation"
          git config user.email "actions@users.noreply.github.com"
          git add css/style.css
          git diff --cached --check
          git commit -m "Fix gameplan card layout [skip ci]"
          git push origin HEAD:fix/gameplan-card-layout
