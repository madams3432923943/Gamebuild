name: Patch gameplan card layout

on:
  push:
    branches:
      - fix/gameplan-card-layout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gameplan-card-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gameplan-card-layout
          fetch-depth: 0

      - name: Fix NFL gameplan card layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('css/style.css')
          css = path.read_text()
          old = '''.tactic-phase .tactic-card {
  min-height: 0;
  flex-direction: row;
  align-items: center;
  gap: 0.6rem;
}

.tactic-phase .tactic-head { flex: 0 0 9.5rem; }
'''
          new = '''.tactic-phase .tactic-card {
  min-height: 0;
  flex-direction: column;
  align-items: stretch;
  gap: 0.45rem;
  padding: 0.75rem 0.8rem;
}

/* Gameplan cards should read top-to-bottom. The previous desktop override
   forced the title into a fixed 9.5rem column beside the description, which
   squeezed the blurb into a vertical strip exactly like the NFL screenshot. */
.tactic-phase .tactic-head {
  flex: none;
  width: 100%;
  font-size: 0.82rem;
  line-height: 1.2;
}

.tactic-phase .tactic-blurb {
  width: 100%;
  font-size: 0.72rem;
  line-height: 1.35;
}
'''
          if old not in css:
              raise SystemExit('Expected tactic-phase card override not found')
          path.write_text(css.replace(old, new, 1))
          PY

          git config user.name "Draft Nova Automation"
          git config user.email "actions@users.noreply.github.com"
          git add css/style.css
          git diff --cached --check
          git commit -m "Fix gameplan card layout [gameplan-card-patched]"
          git push origin HEAD:fix/gameplan-card-layout
