<!doctype html>
<meta charset="utf-8">
<title>Box score harness</title>
<!-- Page for verify-box-score.mjs. Real browser, real origin, so the app's own
     modules and datasets load as they do in index.html - but with no app boot,
     so a rendered box score is the only thing under test.

     THE VIEWPORT META AND THE STYLESHEET ARE BOTH LOAD-BEARING. Without the
     meta the page lays out at the 980px default however small the device is,
     so every media query in style.css evaluates as desktop and a "phone"
     measurement is a desktop measurement wearing a phone's screenshot size.
     Without the stylesheet the table is unstyled HTML. Neither mattered while
     this file only checked STRUCTURE - column counts and cell contents - and
     both matter now that it also checks that the name column does not
     collapse. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* The app puts the box score in a scroll frame. Without one the table sizes
     to the whole document and nothing measured here matches the screen. */
  body { margin: 0; background: #0d1117; }
  #box { overflow-x: auto; }
</style>
<div id="box"></div>
